services:
  frontend:
    ports: !reset []

  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN es obligatorio}
      TLS_EMAIL: ${TLS_EMAIL:?TLS_EMAIL es obligatorio}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - app
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    pids_limit: 100

volumes:
  caddy_data:
  caddy_config:
