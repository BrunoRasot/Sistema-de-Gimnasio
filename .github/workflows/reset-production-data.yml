name: Reset production data

on:
  workflow_dispatch:
    inputs:
      keep_username:
        description: Usuario que se conservara
        required: true
        default: Bruno
        type: string
      confirmation:
        description: Escriba BORRAR_TODO_MENOS_USUARIO
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database-backup
  cancel-in-progress: false

jobs:
  reset:
    name: Keep one user and remove operational data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      KEEP_USERNAME: ${{ inputs.keep_username }}
      CONFIRM_RESET_PRODUCTION: ${{ inputs.confirmation }}

    steps:
      - name: Validate confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$KEEP_USERNAME" != "Bruno" ]]; then
            echo "This workflow is restricted to keeping the Bruno account." >&2
            exit 1
          fi
          if [[ "$CONFIRM_RESET_PRODUCTION" != "BORRAR_TODO_MENOS_USUARIO" ]]; then
            echo "The confirmation phrase is incorrect." >&2
            exit 1
          fi
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "Required secret NEON_DATABASE_URL is missing." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: server
        run: pnpm exec prisma generate

      - name: Reset production business data
        working-directory: server
        run: pnpm exec tsx src/scripts/reset-business-data.ts
